

<div>items().length = {{items().length}}</div>
@let itemForms = items();

<div>
    Items:
    <table>
        <tr><th>Description</th><th>Quantity</th><th>Price</th></tr>
        @for(item of itemForms; track $index){
            <tr>
                <td><input [field]="item.description" /></td>
                <td><input [field]="item.price" type="number" /></td>
                <td><input [field]="item.qty" type="number" /></td>
            </tr>
        }
    </table>
</div>
